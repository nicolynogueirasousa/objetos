<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 13</title>
    <script>
        // Crie um objeto que possua uma lista de animais. 
        // Cada animal deverá ter nome, espécie, idade e quantidade produzida. 
        // Crie métodos para cadastrar animais, remover, buscar pelo nome, 
        // alimentar todos e calcular a produção total da fazenda.

        var fazenda = {
            animais: [
                { nome: "Mimosa", especie: "Vaca", idade: 4, producao: 15 },
                { nome: "Giselda", especie: "Galinha", idade: 2, producao: 2 }
            ],

            cadastrarAnimal(){
                var nome = prompt("Nome:")
                var especie = prompt("Espécie:")
                var idade = Number(prompt("Idade:"))
                var producao = Number(prompt("Quantidade produzida:"))

                this.animais.push({ nome: nome, especie: especie, idade: idade, producao: producao })
                alert("Animal cadastrado!")
            },

            removerAnimal(){
                this.animais.pop()
                alert("Último animal removido!")
            },

            buscarPorNome(){
                var busca = prompt("Nome do animal:")

                for (var i = 0; i < this.animais.length; i++) {
                    if (this.animais[i].nome == busca) {
                        alert("Encontrado: " + this.animais[i].nome + " (" + this.animais[i].especie + "), " + this.animais[i].idade + " anos, Produção: " + this.animais[i].producao)
                        return
                    }
                }
                alert("Animal não encontrado!")
            },

            alimentarTodos() {
                alert("Todos os " + this.animais.length + " animais foram alimentados!")
            },

            calcularProducaoTotal() {
                var total = 0
                for (var i = 0; i < this.animais.length; i++) {
                    total = total + this.animais[i].producao
                }
                alert("Produção total da fazenda: " + total)
            }
        };

        // Execução para teste:
        fazenda.cadastrarAnimal()
        fazenda.buscarPorNome()
        fazenda.alimentarTodos()
        fazenda.calcularProducaoTotal()
        fazenda.removerAnimal()
    </script>
</head>
<body>
    
</body>
</html>
